<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%" height="100%">
  <defs>
    <linearGradient id="miv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="miv-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="scan-cone" cx="10%" cy="50%" r="90%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.35"/>
      <stop offset="80%" stop-color="#00e5ff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style><![CDATA[
    .font-mono { font-family: ui-monospace, 'SFMono-Regular', 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

    @keyframes live-blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.9); }
    }
    @keyframes sweep-beam {
      0%, 100% { transform: rotate(-15deg); }
      50% { transform: rotate(15deg); }
    }
    @keyframes packet-run {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes detect-box {
      0%, 100% { stroke-dashoffset: 0; opacity: 1; }
      50% { opacity: 0.5; }
    }

    .live-dot { animation: live-blink 1.8s infinite; transform-origin: 38px 24px; }
    .scan-beam { animation: sweep-beam 3.5s ease-in-out infinite; transform-origin: 110px 90px; }
    .packet-cable { stroke-dasharray: 6 10; animation: packet-run 1.4s linear infinite; }
    .detect-target { animation: detect-box 2s infinite; }
  ]]></style>

  <!-- Background Card -->
  <rect x="2" y="2" width="896" height="176" rx="12" fill="url(#miv-bg)" stroke="url(#miv-border)" stroke-width="1.2"/>

  <!-- Top Bar -->
  <g transform="translate(24, 18)">
    <circle class="live-dot" cx="14" cy="6" r="4.5" fill="#ef4444"/>
    <text x="26" y="10" class="font-mono" font-size="10.5" font-weight="700" fill="#ef4444" letter-spacing="1">LIVE STREAM</text>
    <text x="140" y="10" class="font-mono" font-size="10" fill="#64748b">ESP32-CAM // EMQX MQTT // LARAVEL REVERB</text>
  </g>

  <!-- ================= ANIMATED CCTV & DETECTION VISUAL ================= -->

  <!-- Camera Body (Left) -->
  <g transform="translate(60, 60)">
    <!-- Base mount -->
    <path d="M 0 30 L 25 30 L 35 45 L 35 15 L 25 30" fill="#1e293b"/>
    <!-- Camera cylinder -->
    <rect x="25" y="15" width="55" height="30" rx="4" fill="#0f172a" stroke="#00e5ff" stroke-width="1.5"/>
    <circle cx="80" cy="30" r="14" fill="#1e293b" stroke="#00e5ff" stroke-width="1.5"/>
    <circle cx="80" cy="30" r="7" fill="#00e5ff"/>
    <!-- Lens Scanning Cone -->
    <path class="scan-beam" d="M 80 30 L 260 -10 L 260 70 Z" fill="url(#scan-cone)"/>
  </g>

  <!-- Connected Cable with Moving Packets (Center) -->
  <path d="M 330 90 L 510 90" fill="none" stroke="#1e293b" stroke-width="2"/>
  <path d="M 330 90 L 510 90" fill="none" stroke="#00e5ff" stroke-width="2" class="packet-cable"/>

  <!-- Protocol Badge on Cable -->
  <g transform="translate(390, 72)">
    <rect x="0" y="0" width="80" height="20" rx="4" fill="#020617" stroke="#38bdf8" stroke-width="1"/>
    <text x="40" y="14" text-anchor="middle" class="font-mono" font-size="8.5" font-weight="700" fill="#38bdf8">MQTT / WSS</text>
  </g>

  <!-- Target Object / Human Detection Box (Middle-Left) -->
  <g transform="translate(240, 62)">
    <rect class="detect-target" x="0" y="0" width="52" height="58" rx="4" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 2"/>
    <rect x="0" y="-12" width="48" height="12" fill="#10b981"/>
    <text x="24" y="-3" text-anchor="middle" class="font-mono" font-size="7.5" font-weight="700" fill="#020617">PERSON</text>
    <text x="26" y="36" text-anchor="middle" font-size="20">🚶</text>
  </g>

  <!-- Cloud / Web Dashboard Mock Card (Right) -->
  <g transform="translate(530, 42)">
    <rect x="0" y="0" width="330" height="106" rx="8" fill="#090e1a" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="0" y="0" width="330" height="24" rx="8" fill="#1e293b" opacity="0.5"/>
    <circle cx="12" cy="12" r="3.5" fill="#ef4444"/>
    <circle cx="22" cy="12" r="3.5" fill="#f59e0b"/>
    <circle cx="32" cy="12" r="3.5" fill="#10b981"/>
    <text x="50" y="16" class="font-mono" font-size="9" fill="#94a3b8">Mivion Control Dashboard</text>

    <!-- Sub components inside card -->
    <g transform="translate(14, 36)">
      <!-- OTA Status Badge -->
      <rect x="0" y="0" width="140" height="26" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="8" y="17" class="font-mono" font-size="8.5" fill="#38bdf8">⚡ OTA Rollout: Active</text>

      <!-- MinIO Storage Badge -->
      <rect x="150" y="0" width="145" height="26" rx="4" fill="#0f172a" stroke="#e11d48" stroke-width="1"/>
      <text x="158" y="17" class="font-mono" font-size="8.5" fill="#fb7185">📦 MinIO S3 Storage</text>

      <!-- YOLO Inference Badge -->
      <rect x="0" y="34" width="295" height="26" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <text x="8" y="51" class="font-mono" font-size="8.5" fill="#34d399">🤖 YOLO Inference Feedback: OK</text>
    </g>
  </g>
</svg>
