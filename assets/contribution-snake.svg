  <style><![CDATA[
    .font-mono { font-family: ui-monospace, 'SFMono-Regular', 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

    @keyframes crawl-x {
      0% { transform: translateX(0px); }
      50% { transform: translateX(240px); }
      100% { transform: translateX(0px); }
    }
    @keyframes eat-pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.3); opacity: 0.3; }
    }

    .snake-body { animation: crawl-x 8s ease-in-out infinite; }
    .pellet { animation: eat-pulse 1.5s infinite; }
  ]]></style>

  <rect x="2" y="2" width="896" height="156" rx="12" fill="url(#snake-bg)" stroke="url(#snake-border)" stroke-width="1.2"/>

