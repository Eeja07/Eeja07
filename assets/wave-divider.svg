<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 40" width="100%" height="100%">
  <defs>
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <style><![CDATA[
    @keyframes wave-motion {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -120; }
    }
    .wave-line { stroke-dasharray: 8 16; animation: wave-motion 4s linear infinite; }
  ]]></style>

  <!-- Glowing background line -->
  <path d="M 0 20 Q 230 5 460 20 T 920 20" fill="none" stroke="url(#wave-grad)" stroke-width="2" opacity="0.4"/>
  <!-- Animated packet flow line -->
  <path class="wave-line" d="M 0 20 Q 230 5 460 20 T 920 20" fill="none" stroke="url(#wave-grad)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
