<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="100%">
  <defs>
    <pattern id="drone-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.4"/>
    </pattern>

    <linearGradient id="drone-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="drone-box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <style><![CDATA[
    .font-mono { font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, 'Courier New', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

    @keyframes packet-h {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes packet-v {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulse-radar {
      0% { r: 6px; opacity: 0.9; }
      100% { r: 20px; opacity: 0; }
    }

    .flow-h { stroke-dasharray: 6 10; animation: packet-h 1.5s linear infinite; }
    .flow-v { stroke-dasharray: 6 10; animation: packet-v 1.5s linear infinite; }
    .radar-ring { transform-origin: 75px 120px; animation: pulse-radar 2s cubic-bezier(0.2, 0.8, 0.4, 1) infinite; }
  ]]></style>

  <!-- Frame Background -->
  <rect x="2" y="2" width="916" height="396" rx="10" fill="#090d16" stroke="url(#drone-border)" stroke-width="1.2"/>
  <rect x="6" y="6" width="908" height="388" rx="8" fill="url(#drone-grid)"/>

  <!-- Top Title Bar -->
  <g transform="translate(30, 24)">
    <circle cx="6" cy="6" r="4" fill="#a855f7"/>
    <text x="18" y="10" class="font-mono" font-size="11" font-weight="700" fill="#a855f7" letter-spacing="1.5">NODE_02 ARCHITECTURE // AUTONOMOUS DRONE HUMAN SEARCH SYSTEM</text>
    <text x="860" y="10" text-anchor="end" class="font-mono" font-size="9" fill="#64748b">HOLYBRO S500 // OFFBOARD AUTOPILOT</text>
  </g>

  <!-- ================= MODULE BLOCKS ================= -->

  <!-- 1. GROUND & TELEMETRY CONTROL (Left) -->
  <g transform="translate(30, 70)">
    <rect x="0" y="0" width="160" height="290" rx="8" fill="url(#drone-box)" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="0" y="0" width="160" height="26" rx="8" fill="#1e293b" opacity="0.6"/>
    <text x="80" y="17" text-anchor="middle" class="font-mono" font-size="9.5" font-weight="700" fill="#38bdf8">GROUND CONTROL</text>

    <g transform="translate(12, 40)">
      <rect x="0" y="0" width="136" height="64" rx="5" fill="#0b1120" stroke="#38bdf8" stroke-width="1"/>
      <text x="10" y="18" class="font-mono" font-size="8.5" font-weight="700" fill="#f8fafc">QGroundControl (GCS)</text>
      <text x="10" y="32" class="font-mono" font-size="7.5" fill="#94a3b8">• Telemetry Downlink</text>
      <text x="10" y="46" class="font-mono" font-size="7.5" fill="#38bdf8">• Mission Waypoints</text>
    </g>

    <g transform="translate(12, 120)">
      <rect x="0" y="0" width="136" height="64" rx="5" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
      <text x="10" y="18" class="font-mono" font-size="8.5" font-weight="700" fill="#f8fafc">Radio Telemetry 915MHz</text>
      <text x="10" y="32" class="font-mono" font-size="7.5" fill="#94a3b8">• Long-Range RF Link</text>
      <text x="10" y="46" class="font-mono" font-size="7.5" fill="#a855f7">• MAVLink Data Streams</text>
    </g>

    <g transform="translate(12, 200)">
      <rect x="0" y="0" width="136" height="70" rx="5" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
      <text x="10" y="18" class="font-mono" font-size="8.5" font-weight="700" fill="#10b981">Emergency Manual RC</text>
      <text x="10" y="32" class="font-mono" font-size="7.5" fill="#94a3b8">• 2.4GHz Direct Override</text>
      <text x="10" y="46" class="font-mono" font-size="7.5" fill="#94a3b8">• Failsafe Hardware Cut</text>
    </g>
  </g>


  <!-- 2. FLIGHT CONTROLLER (Center-Left) -->
  <g transform="translate(240, 70)">
    <rect x="0" y="0" width="180" height="290" rx="8" fill="url(#drone-box)" stroke="#a855f7" stroke-width="1.2"/>
    <rect x="0" y="0" width="180" height="26" rx="8" fill="#a855f7" opacity="0.2"/>
    <text x="12" y="17" class="font-mono" font-size="9.5" font-weight="700" fill="#c084fc">PIXHAWK 6C (PX4)</text>
    <text x="168" y="17" text-anchor="end" class="font-mono" font-size="8" fill="#64748b">AUTOPILOT</text>

    <g transform="translate(12, 38)">
      <rect x="0" y="0" width="156" height="48" rx="4" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
      <text x="8" y="16" class="font-mono" font-size="8.5" font-weight="700" fill="#f8fafc">IMU &amp; Sensor Fusion</text>
      <text x="8" y="30" class="font-mono" font-size="7.5" fill="#94a3b8">EKF2 Attitude &amp; Baro</text>
    </g>

    <g transform="translate(12, 96)">
      <rect x="0" y="0" width="156" height="48" rx="4" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
      <text x="8" y="16" class="font-mono" font-size="8.5" font-weight="700" fill="#f8fafc">Offboard Flight Mode</text>
      <text x="8" y="30" class="font-mono" font-size="7.5" fill="#a855f7">Position / Velocity Setpts</text>
    </g>

    <g transform="translate(12, 154)">
      <rect x="0" y="0" width="156" height="48" rx="4" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
      <text x="8" y="16" class="font-mono" font-size="8.5" font-weight="700" fill="#f8fafc">Hardware Actuators</text>
      <text x="8" y="30" class="font-mono" font-size="7.5" fill="#94a3b8">4x BLDC ESCs (PWM/DShot)</text>
    </g>

    <g transform="translate(12, 212)">
      <rect x="0" y="0" width="156" height="58" rx="4" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
      <text x="8" y="16" class="font-mono" font-size="8.5" font-weight="700" fill="#f87171">Failsafe Supervisor</text>
      <text x="8" y="30" class="font-mono" font-size="7.5" fill="#94a3b8">• Low Batt Auto RTL</text>
      <text x="8" y="44" class="font-mono" font-size="7.5" fill="#94a3b8">• Heartbeat Loss Recover</text>
    </g>
  </g>


  <!-- 3. RASPBERRY PI 5 COMPANION COMPUTER (Center-Right) -->
  <g transform="translate(470, 70)">
    <rect x="0" y="0" width="200" height="290" rx="8" fill="url(#drone-box)" stroke="#ec4899" stroke-width="1.2"/>
    <rect x="0" y="0" width="200" height="26" rx="8" fill="#ec4899" opacity="0.2"/>
    <text x="12" y="17" class="font-mono" font-size="9.5" font-weight="700" fill="#f472b6">RASPBERRY PI 5</text>
    <text x="188" y="17" text-anchor="end" class="font-mono" font-size="8" fill="#64748b">COMPANION</text>

    <!-- MAVSDK Daemon -->
    <g transform="translate(12, 38)">
      <rect x="0" y="0" width="176" height="48" rx="4" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
      <text x="8" y="16" class="font-mono" font-size="8.5" font-weight="700" fill="#f8fafc">MAVSDK Control Engine</text>
      <text x="8" y="30" class="font-mono" font-size="7.5" fill="#ec4899">Async Mission / Offboard</text>
    </g>

    <!-- Autonomous Search Logic -->
    <g transform="translate(12, 96)">
      <rect x="0" y="0" width="176" height="54" rx="4" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
      <text x="8" y="16" class="font-mono" font-size="8.5" font-weight="700" fill="#f8fafc">Autonomous Search Logic</text>
      <text x="8" y="30" class="font-mono" font-size="7.5" fill="#94a3b8">• Systematic Area Sweep</text>
      <text x="8" y="44" class="font-mono" font-size="7.5" fill="#94a3b8">• Target Acquisition Lock</text>
    </g>

    <!-- YOLOv8n ONNX Runtime -->
    <g transform="translate(12, 160)">
      <rect x="0" y="0" width="176" height="56" rx="4" fill="#0b1120" stroke="#ec4899" stroke-width="1"/>
      <text x="8" y="16" class="font-mono" font-size="8.5" font-weight="700" fill="#f472b6">YOLOv8n ONNX Engine</text>
      <text x="8" y="30" class="font-mono" font-size="7.5" fill="#94a3b8">• yolov8n320.onnx Model</text>
      <text x="8" y="44" class="font-mono" font-size="7.5" fill="#34d399">• Real-Time Edge Inference</text>
    </g>

    <!-- Shell Process Coordinator -->
    <g transform="translate(12, 226)">
      <rect x="0" y="0" width="176" height="48" rx="4" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
      <text x="8" y="16" class="font-mono" font-size="8.5" font-weight="700" fill="#f8fafc">Process Manager (Fish)</text>
      <text x="8" y="30" class="font-mono" font-size="7.5" fill="#94a3b8">start_all.fish / status.fish</text>
    </g>
  </g>


  <!-- 4. PERIPHERALS & TELEMETRY STREAM (Right) -->
  <g transform="translate(715, 70)">
    <rect x="0" y="0" width="175" height="290" rx="8" fill="url(#drone-box)" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="0" y="0" width="175" height="26" rx="8" fill="#1e293b" opacity="0.6"/>
    <text x="87" y="17" text-anchor="middle" class="font-mono" font-size="9.5" font-weight="700" fill="#34d399">SENSORS &amp; STREAM</text>

    <!-- Camera Feed -->
    <g transform="translate(12, 40)">
      <rect x="0" y="0" width="151" height="70" rx="5" fill="#0b1120" stroke="#34d399" stroke-width="1"/>
      <text x="10" y="18" class="font-mono" font-size="8.5" font-weight="700" fill="#ffffff">High-Res Camera</text>
      <text x="10" y="32" class="font-mono" font-size="7.5" fill="#94a3b8">• CSI / USB Frame Ingest</text>
      <text x="10" y="46" class="font-mono" font-size="7.5" fill="#94a3b8">• OpenCV Preprocessing</text>
      <text x="10" y="60" class="font-mono" font-size="7.5" fill="#34d399">RGB Native Buffer</text>
    </g>

    <!-- Flask Video Server -->
    <g transform="translate(12, 125)">
      <rect x="0" y="0" width="151" height="70" rx="5" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
      <text x="10" y="18" class="font-mono" font-size="8.5" font-weight="700" fill="#f8fafc">Flask Telemetry Server</text>
      <text x="10" y="32" class="font-mono" font-size="7.5" fill="#94a3b8">• MJPEG Bounding Stream</text>
      <text x="10" y="46" class="font-mono" font-size="7.5" fill="#94a3b8">• Live Detection Postback</text>
      <text x="10" y="60" class="font-mono" font-size="7.5" fill="#38bdf8">:5000 Video Port</text>
    </g>

    <!-- GNSS Positioning -->
    <g transform="translate(12, 210)">
      <rect x="0" y="0" width="151" height="64" rx="5" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
      <text x="10" y="18" class="font-mono" font-size="8.5" font-weight="700" fill="#f8fafc">RTK / GPS Receiver</text>
      <text x="10" y="32" class="font-mono" font-size="7.5" fill="#94a3b8">• 3D Spatial Geolocation</text>
      <text x="10" y="46" class="font-mono" font-size="7.5" fill="#10b981">GNSS Position Lock</text>
    </g>
  </g>


  <!-- ================= BUS CABLES ================= -->
  <!-- Ground -> Pixhawk -->
  <line x1="190" y1="152" x2="240" y2="152" stroke="#38bdf8" stroke-width="2"/>
  <line x1="190" y1="152" x2="240" y2="152" stroke="#38bdf8" stroke-width="2" class="flow-h"/>

  <!-- Pixhawk <-> Pi 5 (UART MAVLink Bridge) -->
  <line x1="420" y1="120" x2="470" y2="120" stroke="#a855f7" stroke-width="2"/>
  <line x1="420" y1="120" x2="470" y2="120" stroke="#a855f7" stroke-width="2" class="flow-h"/>

  <!-- Camera -> Pi 5 -->
  <line x1="715" y1="75" x2="670" y2="75" stroke="#34d399" stroke-width="2"/>
  <line x1="715" y1="75" x2="670" y2="75" stroke="#34d399" stroke-width="2" class="flow-h"/>

  <!-- Pi 5 -> Flask Server -->
  <line x1="670" y1="160" x2="715" y2="160" stroke="#ec4899" stroke-width="2"/>
  <line x1="670" y1="160" x2="715" y2="160" stroke="#ec4899" stroke-width="2" class="flow-h"/>
</svg>
