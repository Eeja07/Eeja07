<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="100%">
  <defs>
    <pattern id="lab-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.4"/>
    </pattern>

    <linearGradient id="lab-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="lab-box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <style><![CDATA[
    .font-mono { font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, 'Courier New', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

    @keyframes flow-down {
      0% { stroke-dashoffset: 48; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulse-signal {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.3; }
    }

    .flow-stream { stroke-dasharray: 6 12; animation: flow-down 1.8s linear infinite; }
    .pulse-glow { animation: pulse-signal 2.2s ease-in-out infinite; }
  ]]></style>

  <!-- Frame Background -->
  <rect x="2" y="2" width="916" height="436" rx="10" fill="#090d16" stroke="url(#lab-border)" stroke-width="1.2"/>
  <rect x="6" y="6" width="908" height="428" rx="8" fill="url(#lab-grid)"/>

  <!-- Top Title Bar -->
  <g transform="translate(30, 24)">
    <circle cx="6" cy="6" r="4" fill="#10b981" class="pulse-glow"/>
    <text x="18" y="10" class="font-mono" font-size="11" font-weight="700" fill="#10b981" letter-spacing="1.5">INFRASTRUCTURE ARCHITECTURE // HOMELAB &amp; CLOUD ECOSYSTEM</text>
    <text x="860" y="10" text-anchor="end" class="font-mono" font-size="9" fill="#64748b">ZERO-TRUST INGRESS // DOCKER MESH</text>
  </g>

  <!-- ================= LAYER 1: INGRESS & SECURITY (Top Row) ================= -->
  <!-- Internet Source -->
  <g transform="translate(40, 56)">
    <rect x="0" y="0" width="180" height="54" rx="6" fill="url(#lab-box)" stroke="#1e293b" stroke-width="1"/>
    <circle cx="14" cy="27" r="4" fill="#00e5ff"/>
    <text x="26" y="22" class="font-mono" font-size="8.5" font-weight="700" fill="#ffffff">PUBLIC INTERNET</text>
    <text x="26" y="38" class="font-mono" font-size="7.5" fill="#64748b">TLS Clients &amp; Browsers</text>
  </g>

  <!-- Cloudflare Tunnel -->
  <g transform="translate(320, 56)">
    <rect x="0" y="0" width="280" height="54" rx="6" fill="url(#lab-box)" stroke="#f97316" stroke-width="1.2"/>
    <circle cx="16" cy="27" r="4.5" fill="#f97316"/>
    <text x="28" y="22" class="font-mono" font-size="9.5" font-weight="700" fill="#fb923c">CLOUDFLARE ZERO-TRUST INGRESS</text>
    <text x="28" y="38" class="font-mono" font-size="7.5" fill="#94a3b8">Cloudflared Daemon • *.eeja.fun • DDoS &amp; SSL</text>
  </g>

  <!-- Tailscale Mesh -->
  <g transform="translate(700, 56)">
    <rect x="0" y="0" width="180" height="54" rx="6" fill="url(#lab-box)" stroke="#38bdf8" stroke-width="1.2"/>
    <circle cx="14" cy="27" r="4" fill="#38bdf8"/>
    <text x="26" y="22" class="font-mono" font-size="8.5" font-weight="700" fill="#38bdf8">TAILSCALE MESH VPN</text>
    <text x="26" y="38" class="font-mono" font-size="7.5" fill="#64748b">Encrypted Node Admin</text>
  </g>

  <!-- Top Ingress Cables -->
  <line x1="220" y1="83" x2="320" y2="83" stroke="#00e5ff" stroke-width="2"/>
  <line x1="220" y1="83" x2="320" y2="83" stroke="#00e5ff" stroke-width="2" class="flow-stream"/>

  <line x1="600" y1="83" x2="700" y2="83" stroke="#38bdf8" stroke-width="2"/>
  <line x1="600" y1="83" x2="700" y2="83" stroke="#38bdf8" stroke-width="2" class="flow-stream"/>

  <!-- Vertical Trunk from Cloudflare to Debian Host -->
  <line x1="460" y1="110" x2="460" y2="140" stroke="#f97316" stroke-width="2.5"/>
  <line x1="460" y1="110" x2="460" y2="140" stroke="#f97316" stroke-width="2.5" class="flow-stream"/>


  <!-- ================= LAYER 2: SELF-HOSTED LINUX HOST FRAME ================= -->
  <g transform="translate(30, 140)">
    <!-- Host Frame Container -->
    <rect x="0" y="0" width="860" height="270" rx="8" fill="#060913" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="860" height="26" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    
    <circle cx="14" cy="13" r="4.5" fill="#10b981"/>
    <text x="26" y="17" class="font-mono" font-size="9.5" font-weight="700" fill="#10b981" letter-spacing="1">HOST ENVIRONMENT // DEBIAN 12 LINUX</text>
    <text x="845" y="17" text-anchor="end" class="font-mono" font-size="8.5" fill="#64748b">KERNEL: 6.1.x // DOCKER ENGINE 26.x</text>

    <!-- Sub-containers (4 Docker Columns) -->

    <!-- Column 1: Web & Reverse Proxy -->
    <g transform="translate(16, 38)">
      <rect x="0" y="0" width="190" height="216" rx="6" fill="#0b1120" stroke="#38bdf8" stroke-width="1"/>
      <rect x="0" y="0" width="190" height="22" rx="6" fill="#0284c7" opacity="0.2"/>
      <text x="10" y="15" class="font-mono" font-size="8.5" font-weight="700" fill="#38bdf8">WEB &amp; PROXY SERVICES</text>

      <g transform="translate(8, 30)">
        <rect x="0" y="0" width="174" height="48" rx="4" fill="#070c17" stroke="#1e293b" stroke-width="1"/>
        <text x="8" y="16" class="font-mono" font-size="8" font-weight="700" fill="#ffffff">portfolio.eeja.fun</text>
        <text x="8" y="30" class="font-mono" font-size="7" fill="#94a3b8">Next.js 15 SSR Container</text>
        <text x="8" y="42" class="font-mono" font-size="7" fill="#38bdf8">Port :3000</text>
      </g>

      <g transform="translate(8, 86)">
        <rect x="0" y="0" width="174" height="48" rx="4" fill="#070c17" stroke="#1e293b" stroke-width="1"/>
        <text x="8" y="16" class="font-mono" font-size="8" font-weight="700" fill="#ffffff">Mivion Web &amp; Reverb</text>
        <text x="8" y="30" class="font-mono" font-size="7" fill="#94a3b8">Laravel 11 &amp; WSS Stream</text>
        <text x="8" y="42" class="font-mono" font-size="7" fill="#a855f7">Port :80, :8080</text>
      </g>

      <g transform="translate(8, 142)">
        <rect x="0" y="0" width="174" height="60" rx="4" fill="#070c17" stroke="#1e293b" stroke-width="1"/>
        <text x="8" y="16" class="font-mono" font-size="8" font-weight="700" fill="#ffffff">JobTracker APIs</text>
        <text x="8" y="30" class="font-mono" font-size="7" fill="#94a3b8">NestJS &amp; Next.js Client</text>
        <text x="8" y="42" class="font-mono" font-size="7" fill="#10b981">Port :3001, :3002</text>
      </g>
    </g>

    <!-- Column 2: IoT & Messaging Bus -->
    <g transform="translate(222, 38)">
      <rect x="0" y="0" width="190" height="216" rx="6" fill="#0b1120" stroke="#a855f7" stroke-width="1"/>
      <rect x="0" y="0" width="190" height="22" rx="6" fill="#7e22ce" opacity="0.2"/>
      <text x="10" y="15" class="font-mono" font-size="8.5" font-weight="700" fill="#c084fc">IOT &amp; MESSAGING CORE</text>

      <g transform="translate(8, 30)">
        <rect x="0" y="0" width="174" height="80" rx="4" fill="#070c17" stroke="#1e293b" stroke-width="1"/>
        <text x="8" y="16" class="font-mono" font-size="8" font-weight="700" fill="#ffffff">EMQX MQTT Broker v5</text>
        <text x="8" y="30" class="font-mono" font-size="7" fill="#94a3b8">• ESP32 Telemetry Ingest</text>
        <text x="8" y="44" class="font-mono" font-size="7" fill="#94a3b8">• Webhook Event Hooks</text>
        <text x="8" y="58" class="font-mono" font-size="7" fill="#94a3b8">• SSL/TLS MQTTS :8883</text>
        <text x="8" y="72" class="font-mono" font-size="7" fill="#a855f7">Port :1883, :18083</text>
      </g>

      <g transform="translate(8, 120)">
        <rect x="0" y="0" width="174" height="82" rx="4" fill="#070c17" stroke="#1e293b" stroke-width="1"/>
        <text x="8" y="16" class="font-mono" font-size="8" font-weight="700" fill="#ffffff">Redis / Queue Cache</text>
        <text x="8" y="30" class="font-mono" font-size="7" fill="#94a3b8">• Job Queue Management</text>
        <text x="8" y="44" class="font-mono" font-size="7" fill="#94a3b8">• Ephemeral State &amp; Cache</text>
        <text x="8" y="58" class="font-mono" font-size="7" fill="#94a3b8">• Sub-millisecond IO</text>
        <text x="8" y="72" class="font-mono" font-size="7" fill="#ef4444">Port :6379</text>
      </g>
    </g>

    <!-- Column 3: Storage & Database -->
    <g transform="translate(428, 38)">
      <rect x="0" y="0" width="200" height="216" rx="6" fill="#0b1120" stroke="#f43f5e" stroke-width="1"/>
      <rect x="0" y="0" width="200" height="22" rx="6" fill="#e11d48" opacity="0.2"/>
      <text x="10" y="15" class="font-mono" font-size="8.5" font-weight="700" fill="#fb7185">STORAGE &amp; DATABASE MESH</text>

      <g transform="translate(8, 30)">
        <rect x="0" y="0" width="184" height="70" rx="4" fill="#070c17" stroke="#1e293b" stroke-width="1"/>
        <text x="8" y="16" class="font-mono" font-size="8" font-weight="700" fill="#ffffff">MinIO Object Storage (S3)</text>
        <text x="8" y="30" class="font-mono" font-size="7" fill="#94a3b8">• S3 Buckets /cctv /firmware</text>
        <text x="8" y="44" class="font-mono" font-size="7" fill="#94a3b8">• 14-day Pruning Lifecycle</text>
        <text x="8" y="58" class="font-mono" font-size="7" fill="#fb7185">Port :9000 (API), :9001 (Console)</text>
      </g>

      <g transform="translate(8, 110)">
        <rect x="0" y="0" width="184" height="92" rx="4" fill="#070c17" stroke="#1e293b" stroke-width="1"/>
        <text x="8" y="16" class="font-mono" font-size="8" font-weight="700" fill="#ffffff">Relational DB Instances</text>
        <text x="8" y="30" class="font-mono" font-size="7" fill="#94a3b8">• PostgreSQL 16 (JobTracker)</text>
        <text x="8" y="44" class="font-mono" font-size="7" fill="#94a3b8">• MySQL 8.0 (Mivion)</text>
        <text x="8" y="58" class="font-mono" font-size="7" fill="#94a3b8">• Automated Volume Backups</text>
        <text x="8" y="72" class="font-mono" font-size="7" fill="#38bdf8">Port :5432, :3306</text>
      </g>
    </g>

    <!-- Column 4: AI & Edge Compute Microservices -->
    <g transform="translate(644, 38)">
      <rect x="0" y="0" width="200" height="216" rx="6" fill="#0b1120" stroke="#10b981" stroke-width="1"/>
      <rect x="0" y="0" width="200" height="22" rx="6" fill="#059669" opacity="0.2"/>
      <text x="10" y="15" class="font-mono" font-size="8.5" font-weight="700" fill="#34d399">EDGE AI &amp; COMPUTATION</text>

      <g transform="translate(8, 30)">
        <rect x="0" y="0" width="184" height="80" rx="4" fill="#070c17" stroke="#1e293b" stroke-width="1"/>
        <text x="8" y="16" class="font-mono" font-size="8" font-weight="700" fill="#ffffff">FastAPI Detection Service</text>
        <text x="8" y="30" class="font-mono" font-size="7" fill="#94a3b8">• YOLO Human Detection</text>
        <text x="8" y="44" class="font-mono" font-size="7" fill="#94a3b8">• Motion Analysis Engine</text>
        <text x="8" y="58" class="font-mono" font-size="7" fill="#94a3b8">• Async Worker Pipeline</text>
        <text x="8" y="72" class="font-mono" font-size="7" fill="#34d399">Port :8001</text>
      </g>

      <g transform="translate(8, 120)">
        <rect x="0" y="0" width="184" height="82" rx="4" fill="#070c17" stroke="#1e293b" stroke-width="1"/>
        <text x="8" y="16" class="font-mono" font-size="8" font-weight="700" fill="#ffffff">Automation &amp; Maintenance</text>
        <text x="8" y="30" class="font-mono" font-size="7" fill="#94a3b8">• Watchtower Container Upd</text>
        <text x="8" y="44" class="font-mono" font-size="7" fill="#94a3b8">• Automated Health Probes</text>
        <text x="8" y="58" class="font-mono" font-size="7" fill="#94a3b8">• Prometheus / Metrics Node</text>
        <text x="8" y="72" class="font-mono" font-size="7" fill="#f59e0b">Internal Mesh</text>
      </g>
    </g>
  </g>
</svg>
