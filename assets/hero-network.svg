<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="100%" height="100%">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="hero-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6"/>
      <circle cx="24" cy="24" r="1" fill="#334155" opacity="0.8"/>
    </pattern>

    <!-- Radial Glow Gradients -->
    <radialGradient id="cyan-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#00e5ff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purple-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="emerald-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="cyber-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <style><![CDATA[
    .font-mono { font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, 'Courier New', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

    /* Cable & Packet Flow Keyframes */
    @keyframes packet-forward {
      0% { stroke-dashoffset: 64; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes packet-reverse {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 64; }
    }
    @keyframes pulse-ring {
      0% { r: 10px; opacity: 0.9; stroke-width: 2px; }
      70% { opacity: 0.15; stroke-width: 1px; }
      100% { r: 26px; opacity: 0; stroke-width: 0.5px; }
    }
    @keyframes pulse-beacon {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.92); }
    }
    @keyframes scanline {
      0% { transform: translateY(-100px); opacity: 0; }
      50% { opacity: 0.08; }
      100% { transform: translateY(440px); opacity: 0; }
    }

    /* Subtitle Carousel Animation */
    @keyframes sub-1 {
      0%, 20% { opacity: 1; transform: translateY(0px); }
      25%, 95% { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 1; transform: translateY(0px); }
    }
    @keyframes sub-2 {
      0%, 20% { opacity: 0; transform: translateY(8px); }
      25%, 45% { opacity: 1; transform: translateY(0px); }
      50%, 100% { opacity: 0; transform: translateY(-8px); }
    }
    @keyframes sub-3 {
      0%, 45% { opacity: 0; transform: translateY(8px); }
      50%, 70% { opacity: 1; transform: translateY(0px); }
      75%, 100% { opacity: 0; transform: translateY(-8px); }
    }
    @keyframes sub-4 {
      0%, 70% { opacity: 0; transform: translateY(8px); }
      75%, 95% { opacity: 1; transform: translateY(0px); }
      100% { opacity: 0; transform: translateY(-8px); }
    }

    .flow-packet-1 { stroke-dasharray: 8 16; animation: packet-forward 1.8s linear infinite; }
    .flow-packet-2 { stroke-dasharray: 6 18; animation: packet-forward 2.2s linear infinite; }
    .flow-packet-3 { stroke-dasharray: 7 14; animation: packet-forward 1.6s linear infinite; }
    .flow-packet-4 { stroke-dasharray: 5 15; animation: packet-forward 2.0s linear infinite; }
    .flow-packet-5 { stroke-dasharray: 8 20; animation: packet-forward 2.5s linear infinite; }

    .pulse-r1 { transform-origin: 690px 70px; animation: pulse-ring 2.4s cubic-bezier(0.2, 0.8, 0.4, 1) infinite; }
    .pulse-r2 { transform-origin: 690px 190px; animation: pulse-ring 2.0s cubic-bezier(0.2, 0.8, 0.4, 1) infinite; }
    .pulse-r3 { transform-origin: 520px 330px; animation: pulse-ring 2.6s cubic-bezier(0.2, 0.8, 0.4, 1) infinite; }
    .pulse-r4 { transform-origin: 630px 345px; animation: pulse-ring 2.3s cubic-bezier(0.2, 0.8, 0.4, 1) infinite; }
    .pulse-r5 { transform-origin: 750px 345px; animation: pulse-ring 2.1s cubic-bezier(0.2, 0.8, 0.4, 1) infinite; }
    .pulse-r6 { transform-origin: 855px 330px; animation: pulse-ring 2.8s cubic-bezier(0.2, 0.8, 0.4, 1) infinite; }

    .status-beacon { animation: pulse-beacon 2s ease-in-out infinite; }
    .scanline-bar { animation: scanline 8s linear infinite; }

    .title-sub-1 { animation: sub-1 12s infinite; }
    .title-sub-2 { animation: sub-2 12s infinite; }
    .title-sub-3 { animation: sub-3 12s infinite; }
    .title-sub-4 { animation: sub-4 12s infinite; }
  ]]></style>

  <!-- Card Background -->
  <rect x="2" y="2" width="916" height="416" rx="12" fill="#090d16" stroke="url(#cyber-border)" stroke-width="1.5"/>
  <rect x="6" y="6" width="908" height="408" rx="10" fill="url(#hero-grid)"/>

  <!-- Scanning Cyber Line -->
  <rect class="scanline-bar" x="6" y="0" width="908" height="40" fill="url(#cyan-glow)" opacity="0.06"/>

  <!-- Corner Tech Accents -->
  <path d="M 6 24 L 6 6 L 24 6" fill="none" stroke="#00e5ff" stroke-width="2.5"/>
  <path d="M 896 6 L 914 6 L 914 24" fill="none" stroke="#00e5ff" stroke-width="2.5"/>
  <path d="M 6 396 L 6 414 L 24 414" fill="none" stroke="#a855f7" stroke-width="2.5"/>
  <path d="M 896 414 L 914 414 L 914 396" fill="none" stroke="#a855f7" stroke-width="2.5"/>

  <!-- ================= LEFT COLUMN: TERMINAL & SYSTEM IDENTITY ================= -->

  <!-- Top System Header Bar -->
  <g transform="translate(36, 36)">
    <!-- Terminal window controls -->
    <circle cx="0" cy="0" r="5" fill="#ef4444" opacity="0.9"/>
    <circle cx="16" cy="0" r="5" fill="#f59e0b" opacity="0.9"/>
    <circle cx="32" cy="0" r="5" fill="#10b981" opacity="0.9"/>

    <text x="52" y="4" class="font-mono" font-size="11" fill="#64748b" letter-spacing="1.5">SYS_ID: 5024221026 // NOC_CORE_NET</text>
  </g>

  <!-- Live Status Badge -->
  <g transform="translate(36, 68)">
    <rect x="0" y="0" width="220" height="26" rx="13" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
    <circle class="status-beacon" cx="14" cy="13" r="4.5" fill="#10b981"/>
    <circle cx="14" cy="13" r="9" fill="url(#emerald-glow)" opacity="0.6"/>
    <text x="28" y="17" class="font-mono" font-size="10.5" font-weight="700" fill="#10b981" letter-spacing="1">SYSTEM STATUS: ONLINE</text>
  </g>

  <!-- Developer Identity Title -->
  <g transform="translate(36, 134)">
    <text x="0" y="0" class="font-sans" font-size="30" font-weight="800" fill="#ffffff" letter-spacing="0.5">MAHIJA IBAD PRADIPTA</text>
    <text x="0" y="24" class="font-mono" font-size="12" font-weight="600" fill="#00e5ff" letter-spacing="2">COMPUTER ENGINEERING GRADUATE</text>
  </g>

  <!-- Animated Rotating Terminal Subtitles -->
  <g transform="translate(36, 196)">
    <rect x="-8" y="-18" width="370" height="34" rx="6" fill="#0d1527" stroke="#1e293b" stroke-width="1"/>
    <text x="6" y="4" class="font-mono" font-size="12" fill="#38bdf8">&gt;</text>
    
    <!-- Rotating Titles -->
    <g class="title-sub-1">
      <text x="24" y="4" class="font-mono" font-size="12" font-weight="600" fill="#f1f5f9">INFRASTRUCTURE &amp; LINUX CLUSTERS</text>
    </g>
    <g class="title-sub-2">
      <text x="24" y="4" class="font-mono" font-size="12" font-weight="600" fill="#38bdf8">IOT &amp; EMBEDDED HARDWARE FLEETS</text>
    </g>
    <g class="title-sub-3">
      <text x="24" y="4" class="font-mono" font-size="12" font-weight="600" fill="#a855f7">FULL-STACK SOFTWARE SYSTEMS</text>
    </g>
    <g class="title-sub-4">
      <text x="24" y="4" class="font-mono" font-size="12" font-weight="600" fill="#34d399">EDGE AI &amp; COMPUTER VISION (YOLO)</text>
    </g>
  </g>

  <!-- Telemetry Metrics Grid Box -->
  <g transform="translate(36, 250)">
    <rect x="0" y="0" width="380" height="126" rx="8" fill="#0b1120" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Row 1: Protocol & Latency -->
    <g transform="translate(16, 24)">
      <circle cx="4" cy="4" r="3" fill="#00e5ff"/>
      <text x="14" y="8" class="font-mono" font-size="10.5" fill="#64748b">LINK PROTOCOL</text>
      <text x="14" y="24" class="font-mono" font-size="11.5" font-weight="700" fill="#e2e8f0">MQTT / WSS / MAVLINK</text>
    </g>

    <g transform="translate(200, 24)">
      <circle cx="4" cy="4" r="3" fill="#10b981"/>
      <text x="14" y="8" class="font-mono" font-size="10.5" fill="#64748b">CORE TELEMETRY</text>
      <text x="14" y="24" class="font-mono" font-size="11.5" font-weight="700" fill="#10b981">LATENCY: 12ms [0% LOSS]</text>
    </g>

    <!-- Divider line -->
    <line x1="16" y1="62" x2="364" y2="62" stroke="#1e293b" stroke-width="1"/>

    <!-- Row 2: Location & Edge Cluster -->
    <g transform="translate(16, 80)">
      <circle cx="4" cy="4" r="3" fill="#a855f7"/>
      <text x="14" y="8" class="font-mono" font-size="10.5" fill="#64748b">PRIMARY DOMAIN</text>
      <text x="14" y="24" class="font-mono" font-size="11.5" font-weight="700" fill="#a855f7">portfolio.eeja.fun</text>
    </g>

    <g transform="translate(200, 80)">
      <circle cx="4" cy="4" r="3" fill="#f59e0b"/>
      <text x="14" y="8" class="font-mono" font-size="10.5" fill="#64748b">ACTIVE NODES</text>
      <text x="14" y="24" class="font-mono" font-size="11.5" font-weight="700" fill="#f59e0b">4 DEPLOYED SERVICES</text>
    </g>
  </g>


  <!-- ================= RIGHT COLUMN: ANIMATED NETWORK TOPOLOGY ================= -->

  <!-- FIBER CABLE 1: Gateway -> Sys_Core -->
  <g>
    <line x1="690" y1="70" x2="690" y2="190" stroke="#1e293b" stroke-width="3"/>
    <line x1="690" y1="70" x2="690" y2="190" stroke="#00e5ff" stroke-width="3" opacity="0.3"/>
    <line x1="690" y1="70" x2="690" y2="190" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" class="flow-packet-1"/>
  </g>

  <!-- FIBER CABLE 2: Sys_Core -> Node 01 (CCTV) -->
  <g>
    <path d="M 690 190 Q 580 230 520 330" fill="none" stroke="#1e293b" stroke-width="3"/>
    <path d="M 690 190 Q 580 230 520 330" fill="none" stroke="#00e5ff" stroke-width="3" opacity="0.3"/>
    <path d="M 690 190 Q 580 230 520 330" fill="none" stroke="#00e5ff" stroke-width="3" stroke-linecap="round" class="flow-packet-2"/>
  </g>

  <!-- FIBER CABLE 3: Sys_Core -> Node 02 (DRONE) -->
  <g>
    <path d="M 690 190 Q 650 250 630 345" fill="none" stroke="#1e293b" stroke-width="3"/>
    <path d="M 690 190 Q 650 250 630 345" fill="none" stroke="#a855f7" stroke-width="3" opacity="0.3"/>
    <path d="M 690 190 Q 650 250 630 345" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round" class="flow-packet-3"/>
  </g>

  <!-- FIBER CABLE 4: Sys_Core -> Node 03 (JOBTRACKER) -->
  <g>
    <path d="M 690 190 Q 730 250 750 345" fill="none" stroke="#1e293b" stroke-width="3"/>
    <path d="M 690 190 Q 730 250 750 345" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.3"/>
    <path d="M 690 190 Q 730 250 750 345" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" class="flow-packet-4"/>
  </g>

  <!-- FIBER CABLE 5: Sys_Core -> Node 04 (HOMELAB) -->
  <g>
    <path d="M 690 190 Q 800 230 855 330" fill="none" stroke="#1e293b" stroke-width="3"/>
    <path d="M 690 190 Q 800 230 855 330" fill="none" stroke="#10b981" stroke-width="3" opacity="0.3"/>
    <path d="M 690 190 Q 800 230 855 330" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" class="flow-packet-5"/>
  </g>

  <!-- ================= TOPOLOGY NODES ================= -->

  <!-- NODE 0: INTERNET GATEWAY (690, 70) -->
  <g transform="translate(690, 70)">
    <circle class="pulse-r1" cx="0" cy="0" r="14" fill="none" stroke="#00e5ff" opacity="0.8"/>
    <circle cx="0" cy="0" r="18" fill="#0f172a" stroke="#00e5ff" stroke-width="2"/>
    <circle cx="0" cy="0" r="8" fill="#00e5ff"/>
    <rect x="-65" y="-36" width="130" height="20" rx="4" fill="#020617" stroke="#00e5ff" stroke-width="1"/>
    <text x="0" y="-22" text-anchor="middle" class="font-mono" font-size="9" font-weight="700" fill="#00e5ff" letter-spacing="1">INTERNET GATEWAY</text>
  </g>

  <!-- NODE CORE: MAHIJA SYSTEM CORE (690, 190) -->
  <g transform="translate(690, 190)">
    <circle class="pulse-r2" cx="0" cy="0" r="18" fill="none" stroke="#38bdf8" opacity="0.8"/>
    <rect x="-70" y="-18" width="140" height="36" rx="8" fill="#0a192f" stroke="#00e5ff" stroke-width="2"/>
    <circle cx="-48" cy="0" r="5" fill="#10b981" class="status-beacon"/>
    <text x="10" y="-2" text-anchor="middle" class="font-mono" font-size="11" font-weight="800" fill="#ffffff" letter-spacing="1">MAHIJA SYSTEM</text>
    <text x="10" y="11" text-anchor="middle" class="font-mono" font-size="8.5" font-weight="600" fill="#38bdf8" letter-spacing="1.5">SYS_CORE // ACTIVE</text>
  </g>

  <!-- LEAF NODE 1: CCTV FLEET (520, 330) -->
  <g transform="translate(520, 330)">
    <circle class="pulse-r3" cx="0" cy="0" r="12" fill="none" stroke="#00e5ff" opacity="0.8"/>
    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#00e5ff" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="6" fill="#00e5ff"/>
    <rect x="-48" y="20" width="96" height="28" rx="4" fill="#020617" stroke="#1e293b" stroke-width="1"/>
    <text x="0" y="32" text-anchor="middle" class="font-mono" font-size="8.5" font-weight="700" fill="#f1f5f9">NODE_01: CCTV</text>
    <text x="0" y="43" text-anchor="middle" class="font-mono" font-size="7" fill="#00e5ff">ESP32 / MQTT / WSS</text>
  </g>

  <!-- LEAF NODE 2: DRONE SYSTEM (630, 345) -->
  <g transform="translate(630, 345)">
    <circle class="pulse-r4" cx="0" cy="0" r="12" fill="none" stroke="#a855f7" opacity="0.8"/>
    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#a855f7" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="6" fill="#a855f7"/>
    <rect x="-50" y="20" width="100" height="28" rx="4" fill="#020617" stroke="#1e293b" stroke-width="1"/>
    <text x="0" y="32" text-anchor="middle" class="font-mono" font-size="8.5" font-weight="700" fill="#f1f5f9">NODE_02: DRONE</text>
    <text x="0" y="43" text-anchor="middle" class="font-mono" font-size="7" fill="#a855f7">PI 5 / YOLO / MAVSDK</text>
  </g>

  <!-- LEAF NODE 3: JOBTRACKER (750, 345) -->
  <g transform="translate(750, 345)">
    <circle class="pulse-r5" cx="0" cy="0" r="12" fill="none" stroke="#38bdf8" opacity="0.8"/>
    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="6" fill="#38bdf8"/>
    <rect x="-52" y="20" width="104" height="28" rx="4" fill="#020617" stroke="#1e293b" stroke-width="1"/>
    <text x="0" y="32" text-anchor="middle" class="font-mono" font-size="8.5" font-weight="700" fill="#f1f5f9">NODE_03: JOBTRACK</text>
    <text x="0" y="43" text-anchor="middle" class="font-mono" font-size="7" fill="#38bdf8">NESTJS / NEXT / PGSQL</text>
  </g>

  <!-- LEAF NODE 4: HOMELAB / DOCKER (855, 330) -->
  <g transform="translate(855, 330)">
    <circle class="pulse-r6" cx="0" cy="0" r="12" fill="none" stroke="#10b981" opacity="0.8"/>
    <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#10b981" stroke-width="1.8"/>
    <circle cx="0" cy="0" r="6" fill="#10b981"/>
    <rect x="-48" y="20" width="96" height="28" rx="4" fill="#020617" stroke="#1e293b" stroke-width="1"/>
    <text x="0" y="32" text-anchor="middle" class="font-mono" font-size="8.5" font-weight="700" fill="#f1f5f9">NODE_04: HOMELAB</text>
    <text x="0" y="43" text-anchor="middle" class="font-mono" font-size="7" fill="#10b981">DOCKER / CLOUDFLARE</text>
  </g>
</svg>
