      <text x="107" y="51" text-anchor="middle" class="font-sans" font-size="10.5" font-weight="600" fill="#f8fafc">Nginx</text>

      <rect x="142" y="34" width="90" height="26" rx="5" fill="#111827" stroke="#334155" stroke-width="1"/>
