      <rect x="268" y="0" width="74" height="28" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="305" y="18" text-anchor="middle" class="font-sans" font-size="11" font-weight="500" fill="#e6edf3">Node.js</text>

      <!-- Row 2 -->
