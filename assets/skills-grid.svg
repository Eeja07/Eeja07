  <!-- CARD 4: INFRASTRUCTURE (Bottom-Right) -->
  <g transform="translate(470, 160)">
    <rect x="0" y="0" width="440" height="135" rx="12" fill="url(#card-soft-1)" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="0" y="0" width="440" height="34" rx="12" fill="#1e293b" opacity="0.4"/>
    
    <text x="16" y="23" font-size="16">🌐</text>
    <text x="42" y="22" class="font-sans" font-size="13" font-weight="700" fill="#818cf8">Infrastructure &amp; Homelab</text>

    <g transform="translate(16, 48)">
      <rect x="0" y="0" width="108" height="28" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="54" y="18" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#f8fafc">Linux (Debian)</text>

      <rect x="116" y="0" width="72" height="28" rx="6" fill="#111827" stroke="#38bdf8" stroke-width="1"/>
      <text x="152" y="18" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#38bdf8">Docker</text>

      <rect x="196" y="0" width="138" height="28" rx="6" fill="#111827" stroke="#f97316" stroke-width="1"/>
      <text x="265" y="18" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#fb923c">Cloudflare Tunnels</text>

      <!-- Row 2 -->
      <rect x="0" y="36" width="76" height="28" rx="6" fill="#111827" stroke="#38bdf8" stroke-width="1"/>
      <text x="38" y="54" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#38bdf8">Tailscale</text>

      <rect x="84" y="36" width="62" height="28" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="115" y="54" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#f8fafc">Nginx</text>

      <rect x="154" y="36" width="94" height="28" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="201" y="54" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#f8fafc">PostgreSQL</text>

      <rect x="256" y="36" width="86" height="28" rx="6" fill="#111827" stroke="#e11d48" stroke-width="1"/>
      <text x="299" y="54" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#fb7185">MinIO (S3)</text>
