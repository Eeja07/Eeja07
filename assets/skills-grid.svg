    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  ]]></style>

  <!-- CARD 1: SOFTWARE & WEB (Top-Left) -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="430" height="125" rx="10" fill="url(#card-bg)" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="0" y="0" width="430" height="32" rx="10" fill="#1e293b" opacity="0.4"/>
    
    <text x="14" y="21" font-size="14">💻</text>
    <text x="36" y="21" class="font-sans" font-size="12.5" font-weight="700" fill="#38bdf8">Software &amp; Web Development</text>

    <g transform="translate(14, 44)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="68" height="26" rx="5" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="34" y="17" text-anchor="middle" class="font-sans" font-size="10.5" font-weight="600" fill="#f8fafc">Python</text>

      <rect x="74" y="0" width="88" height="26" rx="5" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="118" y="17" text-anchor="middle" class="font-sans" font-size="10.5" font-weight="600" fill="#f8fafc">JavaScript</text>

      <rect x="168" y="0" width="88" height="26" rx="5" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="212" y="17" text-anchor="middle" class="font-sans" font-size="10.5" font-weight="600" fill="#f8fafc">TypeScript</text>

