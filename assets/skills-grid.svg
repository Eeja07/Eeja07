      <rect x="108" y="0" width="68" height="26" rx="5" fill="#111827" stroke="#38bdf8" stroke-width="1"/>
      <text x="142" y="17" text-anchor="middle" class="font-sans" font-size="10.5" font-weight="600" fill="#38bdf8">Docker</text>

      <rect x="182" y="0" width="130" height="26" rx="5" fill="#111827" stroke="#f97316" stroke-width="1"/>
