      <rect x="106" y="0" width="66" height="25" rx="4" fill="#0f2d4a" stroke="#0284c7" stroke-width="1"/>
      <text x="139" y="16" text-anchor="middle" class="font-sans" font-size="10.5" font-weight="600" fill="#38bdf8">Docker</text>

      <rect x="178" y="0" width="128" height="25" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
