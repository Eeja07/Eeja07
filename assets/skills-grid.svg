      <text x="59" y="51" text-anchor="middle" class="font-sans" font-size="10.5" font-weight="600" fill="#818cf8">MAVSDK / PX4</text>

      <rect x="124" y="34" width="96" height="26" rx="5" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="172" y="51" text-anchor="middle" class="font-sans" font-size="10.5" font-weight="600" fill="#f8fafc">Pixhawk 6C</text>

      <rect x="226" y="34" width="105" height="26" rx="5" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="278" y="51" text-anchor="middle" class="font-sans" font-size="10.5" font-weight="600" fill="#94a3b8">FastAPI Vision</text>
