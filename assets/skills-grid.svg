<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 310" width="100%" height="100%">
  <defs>
    <linearGradient id="sk-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="card-soft-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
  </defs>

  <style><![CDATA[
    .font-mono { font-family: ui-monospace, 'SFMono-Regular', 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

    @keyframes pulse-pill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    @keyframes badge-glow {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }

    .float-card-1 { animation: pulse-pill 4s ease-in-out infinite; }
    .float-card-2 { animation: pulse-pill 4.5s ease-in-out infinite 0.5s; }
    .float-card-3 { animation: pulse-pill 4.2s ease-in-out infinite 1s; }
    .float-card-4 { animation: pulse-pill 4.8s ease-in-out infinite 1.5s; }
  ]]></style>

  <!-- ================= 4 SKILL CATEGORY CARDS ================= -->

  <!-- CARD 1: SOFTWARE & WEB (Top-Left) -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="440" height="135" rx="12" fill="url(#card-soft-1)" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="0" y="0" width="440" height="34" rx="12" fill="#1e293b" opacity="0.4"/>
    
    <!-- Title -->
    <text x="16" y="23" font-size="16">💻</text>
    <text x="42" y="22" class="font-sans" font-size="13" font-weight="700" fill="#38bdf8">Software &amp; Web Development</text>

    <!-- Pills -->
    <g transform="translate(16, 48)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="70" height="28" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="35" y="18" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#f8fafc">Python</text>

      <rect x="78" y="0" width="92" height="28" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="124" y="18" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#f8fafc">TypeScript</text>

      <rect x="178" y="0" width="90" height="28" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="223" y="18" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#f8fafc">JavaScript</text>

      <rect x="276" y="0" width="76" height="28" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="314" y="18" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#f8fafc">Node.js</text>

      <!-- Row 2 -->
      <rect x="0" y="36" width="78" height="28" rx="6" fill="#111827" stroke="#38bdf8" stroke-width="1"/>
      <text x="39" y="54" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#38bdf8">Next.js 15</text>

      <rect x="86" y="36" width="70" height="28" rx="6" fill="#111827" stroke="#818cf8" stroke-width="1"/>
      <text x="121" y="54" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#818cf8">NestJS</text>

      <rect x="164" y="36" width="80" height="28" rx="6" fill="#111827" stroke="#f43f5e" stroke-width="1"/>
      <text x="204" y="54" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#fb7185">Laravel 11</text>

      <rect x="252" y="36" width="84" height="28" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="294" y="54" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8">REST APIs</text>
    </g>
  </g>


