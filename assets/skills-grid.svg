<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
  </defs>

  <style><![CDATA[
    .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  ]]></style>

  <!-- ================= CARD 1: SOFTWARE & WEB (Top-Left) ================= -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="430" height="140" rx="8" fill="url(#card-bg)" stroke="#30363d" stroke-width="1"/>
    <rect x="0" y="0" width="430" height="34" rx="8" fill="#161b22" opacity="0.9"/>
    
    <circle cx="18" cy="17" r="3.5" fill="#38bdf8"/>
    <text x="32" y="21" class="font-mono" font-size="11.5" font-weight="700" fill="#38bdf8" letter-spacing="0.5">SOFTWARE &amp; WEB</text>

    <!-- Badges Container (Margin-top: 48) -->
    <g transform="translate(16, 48)">
