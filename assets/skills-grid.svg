<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
  </defs>

  <style><![CDATA[
    .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  ]]></style>

  <!-- CARD 1: SOFTWARE & WEB (Top-Left) -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="430" height="125" rx="6" fill="url(#card-bg)" stroke="#30363d" stroke-width="1"/>
    <rect x="0" y="0" width="430" height="30" rx="6" fill="#161b22" opacity="0.9"/>
    
    <circle cx="16" cy="15" r="3" fill="#38bdf8"/>
    <text x="28" y="19" class="font-mono" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="0.5">SOFTWARE &amp; WEB</text>

    <g transform="translate(14, 42)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="66" height="25" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="33" y="16" text-anchor="middle" class="font-sans" font-size="10.5" font-weight="500" fill="#e6edf3">Python</text>

      <rect x="72" y="0" width="86" height="25" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="115" y="16" text-anchor="middle" class="font-sans" font-size="10.5" font-weight="500" fill="#e6edf3">JavaScript</text>

