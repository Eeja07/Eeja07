      <text x="231" y="18" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#34d399">ONNX Runtime</text>

      <!-- Row 2 -->
      <rect x="0" y="36" width="128" height="28" rx="6" fill="#111827" stroke="#818cf8" stroke-width="1"/>
      <text x="64" y="54" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#818cf8">MAVSDK / PX4</text>

      <rect x="136" y="36" width="102" height="28" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="187" y="54" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#f8fafc">Pixhawk 6C</text>

      <rect x="246" y="36" width="112" height="28" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="302" y="54" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8">FastAPI Vision</text>
