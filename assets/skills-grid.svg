      <rect x="114" y="0" width="70" height="28" rx="5" fill="#0f2d4a" stroke="#0284c7" stroke-width="1"/>
      <text x="149" y="18" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#38bdf8">Docker</text>

