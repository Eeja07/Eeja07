      <text x="58" y="48" text-anchor="middle" class="font-sans" font-size="10.5" font-weight="500" fill="#e6edf3">MAVSDK / PX4</text>

      <rect x="122" y="32" width="94" height="25" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="169" y="48" text-anchor="middle" class="font-sans" font-size="10.5" font-weight="500" fill="#e6edf3">Pixhawk 6C</text>

