      <text x="207" y="16" text-anchor="middle" class="font-sans" font-size="10.5" font-weight="500" fill="#e6edf3">TypeScript</text>

      <rect x="256" y="0" width="70" height="25" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="291" y="16" text-anchor="middle" class="font-sans" font-size="10.5" font-weight="500" fill="#e6edf3">Node.js</text>

      <!-- Row 2 -->
      <rect x="0" y="32" width="76" height="25" rx="4" fill="#0f2d4a" stroke="#0284c7" stroke-width="1"/>
      <text x="38" y="48" text-anchor="middle" class="font-sans" font-size="10.5" font-weight="600" fill="#38bdf8">Next.js 15</text>

      <rect x="82" y="32" width="68" height="25" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
