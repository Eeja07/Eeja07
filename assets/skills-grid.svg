      <rect x="0" y="0" width="68" height="28" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="34" y="18" text-anchor="middle" class="font-sans" font-size="11" font-weight="500" fill="#e6edf3">Python</text>

      <rect x="76" y="0" width="88" height="28" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="120" y="18" text-anchor="middle" class="font-sans" font-size="11" font-weight="500" fill="#e6edf3">JavaScript</text>

