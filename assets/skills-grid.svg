      <text x="104" y="48" text-anchor="middle" class="font-sans" font-size="10.5" font-weight="500" fill="#e6edf3">Nginx</text>

      <rect x="138" y="32" width="88" height="25" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
