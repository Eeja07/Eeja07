      <text x="298" y="17" text-anchor="middle" class="font-sans" font-size="10.5" font-weight="600" fill="#f8fafc">Node.js</text>

      <!-- Row 2 -->
      <rect x="0" y="34" width="76" height="26" rx="5" fill="#111827" stroke="#38bdf8" stroke-width="1"/>
      <text x="38" y="51" text-anchor="middle" class="font-sans" font-size="10.5" font-weight="600" fill="#38bdf8">Next.js 15</text>

      <rect x="82" y="34" width="68" height="26" rx="5" fill="#111827" stroke="#818cf8" stroke-width="1"/>
      <text x="116" y="51" text-anchor="middle" class="font-sans" font-size="10.5" font-weight="600" fill="#818cf8">NestJS</text>

