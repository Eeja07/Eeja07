    <rect x="0" y="0" width="440" height="135" rx="12" fill="url(#card-soft-1)" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="0" y="0" width="440" height="34" rx="12" fill="#1e293b" opacity="0.4"/>
    
    <text x="16" y="23" font-size="16">🤖</text>
