      <!-- Row 2 -->
      <rect x="0" y="36" width="110" height="28" rx="6" fill="#111827" stroke="#38bdf8" stroke-width="1"/>
      <text x="55" y="54" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#38bdf8">MQTT / EMQX</text>

      <rect x="118" y="36" width="102" height="28" rx="6" fill="#111827" stroke="#a855f7" stroke-width="1"/>
      <text x="169" y="54" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#c084fc">WebSockets</text>

      <rect x="228" y="36" width="118" height="28" rx="6" fill="#111827" stroke="#334155" stroke-width="1"/>
      <text x="287" y="54" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#94a3b8">OTA Firmware</text>
    </g>
  </g>


  <!-- CARD 3: COMPUTER VISION (Bottom-Left) -->
