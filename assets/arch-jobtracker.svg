<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="100%">
  <defs>
    <pattern id="jt-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.4"/>
    </pattern>

    <linearGradient id="jt-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="jt-box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <style><![CDATA[
    .font-mono { font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, 'Courier New', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

    @keyframes stream-p {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }

    .flow-h { stroke-dasharray: 6 10; animation: stream-p 1.6s linear infinite; }
    .flow-v { stroke-dasharray: 6 10; animation: stream-p 1.6s linear infinite; }
  ]]></style>

  <!-- Frame Background -->
  <rect x="2" y="2" width="916" height="396" rx="10" fill="#090d16" stroke="url(#jt-border)" stroke-width="1.2"/>
  <rect x="6" y="6" width="908" height="388" rx="8" fill="url(#jt-grid)"/>

  <!-- Top Title Bar -->
  <g transform="translate(30, 24)">
    <circle cx="6" cy="6" r="4" fill="#38bdf8"/>
    <text x="18" y="10" class="font-mono" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5">NODE_03 ARCHITECTURE // JOBTRACKER MONOREPO &amp; PRODUCTION API</text>
    <text x="860" y="10" text-anchor="end" class="font-mono" font-size="9" fill="#64748b">TURBOREPO // NESTJS // NEXT.JS</text>
  </g>

  <!-- ================= MONOREPO MODULES ================= -->

  <!-- 1. CLIENT & UI APPS (Left) -->
  <g transform="translate(30, 70)">
    <rect x="0" y="0" width="165" height="290" rx="8" fill="url(#jt-box)" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="0" y="0" width="165" height="26" rx="8" fill="#1e293b" opacity="0.6"/>
    <text x="82" y="17" text-anchor="middle" class="font-mono" font-size="9.5" font-weight="700" fill="#38bdf8">APPS &amp; CLIENTS</text>

    <!-- Next.js Frontend -->
    <g transform="translate(12, 40)">
      <rect x="0" y="0" width="141" height="70" rx="5" fill="#0b1120" stroke="#38bdf8" stroke-width="1"/>
      <text x="10" y="18" class="font-mono" font-size="8.5" font-weight="700" fill="#ffffff">apps/web (Next.js 15)</text>
      <text x="10" y="32" class="font-mono" font-size="7.5" fill="#94a3b8">• React Server Comps</text>
      <text x="10" y="46" class="font-mono" font-size="7.5" fill="#94a3b8">• SSR &amp; Query Hydration</text>
      <text x="10" y="60" class="font-mono" font-size="7.5" fill="#38bdf8">:3000 Web Port</text>
    </g>

    <!-- Shared UI Package -->
    <g transform="translate(12, 125)">
      <rect x="0" y="0" width="141" height="66" rx="5" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
      <text x="10" y="18" class="font-mono" font-size="8.5" font-weight="700" fill="#f8fafc">packages/ui</text>
      <text x="10" y="32" class="font-mono" font-size="7.5" fill="#94a3b8">• Shared Component Lib</text>
      <text x="10" y="46" class="font-mono" font-size="7.5" fill="#94a3b8">• Design Tokens / CSS</text>
    </g>

    <!-- Automation / Bots -->
    <g transform="translate(12, 205)">
      <rect x="0" y="0" width="141" height="65" rx="5" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
      <text x="10" y="18" class="font-mono" font-size="8.5" font-weight="700" fill="#10b981">Client Auth &amp; State</text>
      <text x="10" y="32" class="font-mono" font-size="7.5" fill="#94a3b8">• JWT Secure Tokens</text>
      <text x="10" y="46" class="font-mono" font-size="7.5" fill="#94a3b8">• Optimistic Updates</text>
    </g>
  </g>


  <!-- 2. NESTJS BACKEND API (Center-Left) -->
  <g transform="translate(245, 70)">
    <rect x="0" y="0" width="195" height="290" rx="8" fill="url(#jt-box)" stroke="#6366f1" stroke-width="1.2"/>
    <rect x="0" y="0" width="195" height="26" rx="8" fill="#6366f1" opacity="0.2"/>
    <text x="12" y="17" class="font-mono" font-size="9.5" font-weight="700" fill="#818cf8">APPS/API (NESTJS)</text>
    <text x="183" y="17" text-anchor="end" class="font-mono" font-size="8" fill="#64748b">:3001</text>

    <g transform="translate(12, 38)">
      <rect x="0" y="0" width="171" height="46" rx="4" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
      <text x="8" y="15" class="font-mono" font-size="8.5" font-weight="700" fill="#f8fafc">REST Gateway &amp; Validation</text>
      <text x="8" y="28" class="font-mono" font-size="7.5" fill="#94a3b8">Class-Validator / Pipes</text>
    </g>

    <g transform="translate(12, 94)">
      <rect x="0" y="0" width="171" height="46" rx="4" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
      <text x="8" y="15" class="font-mono" font-size="8.5" font-weight="700" fill="#f8fafc">Security &amp; Auth (Argon2id)</text>
      <text x="8" y="28" class="font-mono" font-size="7.5" fill="#818cf8">Memory-Hard Salt Hashing</text>
    </g>

    <g transform="translate(12, 150)">
      <rect x="0" y="0" width="171" height="46" rx="4" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
      <text x="8" y="15" class="font-mono" font-size="8.5" font-weight="700" fill="#f8fafc">Structured Pino Logger</text>
      <text x="8" y="28" class="font-mono" font-size="7.5" fill="#94a3b8">JSON Stream / Audit Trail</text>
    </g>

    <g transform="translate(12, 206)">
      <rect x="0" y="0" width="171" height="64" rx="4" fill="#0b1120" stroke="#6366f1" stroke-width="1"/>
      <text x="8" y="15" class="font-mono" font-size="8.5" font-weight="700" fill="#818cf8">Prisma Client ORM</text>
      <text x="8" y="28" class="font-mono" font-size="7.5" fill="#94a3b8">• Auto Schema Migrations</text>
      <text x="8" y="42" class="font-mono" font-size="7.5" fill="#94a3b8">• Connection Pooling Guard</text>
    </g>
  </g>


  <!-- 3. DATA & INTEGRATION SERVICES (Center-Right) -->
  <g transform="translate(490, 70)">
    <!-- PostgreSQL -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="180" height="135" rx="8" fill="url(#jt-box)" stroke="#0284c7" stroke-width="1.2"/>
      <rect x="0" y="0" width="180" height="24" rx="8" fill="#0284c7" opacity="0.2"/>
      <text x="12" y="16" class="font-mono" font-size="9.5" font-weight="700" fill="#38bdf8">POSTGRESQL 16</text>
      <text x="168" y="16" text-anchor="end" class="font-mono" font-size="8" fill="#64748b">:5432</text>
      
      <text x="12" y="44" class="font-mono" font-size="8" fill="#94a3b8">• ACID Job Records</text>
      <text x="12" y="62" class="font-mono" font-size="8" fill="#94a3b8">• Application Timeline DB</text>
      <text x="12" y="80" class="font-mono" font-size="8" fill="#94a3b8">• Contact &amp; Company Index</text>
      <text x="12" y="98" class="font-mono" font-size="8" fill="#94a3b8">• Stored Query Optimization</text>
      <rect x="12" y="108" width="156" height="16" rx="3" fill="#0369a1" opacity="0.3"/>
      <text x="90" y="120" text-anchor="middle" class="font-mono" font-size="7.5" font-weight="700" fill="#38bdf8">Prisma Connection Pool</text>
    </g>

    <!-- Gmail Sync Engine -->
    <g transform="translate(0, 155)">
      <rect x="0" y="0" width="180" height="135" rx="8" fill="url(#jt-box)" stroke="#ea580c" stroke-width="1.2"/>
      <rect x="0" y="0" width="180" height="24" rx="8" fill="#ea580c" opacity="0.2"/>
      <text x="12" y="16" class="font-mono" font-size="9.5" font-weight="700" fill="#fb923c">GMAIL SYNC ENGINE</text>
      <text x="168" y="16" text-anchor="end" class="font-mono" font-size="8" fill="#64748b">OAUTH2</text>
      
      <text x="12" y="44" class="font-mono" font-size="8" fill="#94a3b8">• Google API Auth Flow</text>
      <text x="12" y="62" class="font-mono" font-size="8" fill="#94a3b8">• Inbound Status Parsing</text>
      <text x="12" y="80" class="font-mono" font-size="8" fill="#94a3b8">• Interview Event Extract</text>
      <text x="12" y="98" class="font-mono" font-size="8" fill="#94a3b8">• Webhook Event Loop</text>
      <rect x="12" y="108" width="156" height="16" rx="3" fill="#9a3412" opacity="0.3"/>
      <text x="90" y="120" text-anchor="middle" class="font-mono" font-size="7.5" font-weight="700" fill="#fb923c">auto-sync daemon</text>
    </g>
  </g>


  <!-- 4. CI/CD & DEVOPS PIPELINE (Right) -->
  <g transform="translate(715, 70)">
    <rect x="0" y="0" width="175" height="290" rx="8" fill="url(#jt-box)" stroke="#10b981" stroke-width="1.2"/>
    <rect x="0" y="0" width="175" height="26" rx="8" fill="#059669" opacity="0.2"/>
    <text x="12" y="17" class="font-mono" font-size="9.5" font-weight="700" fill="#34d399">CI/CD &amp; DEVOPS</text>
    <text x="163" y="17" text-anchor="end" class="font-mono" font-size="8" fill="#64748b">ACTIONS</text>

    <!-- Multi-stage Docker -->
    <g transform="translate(12, 38)">
      <rect x="0" y="0" width="151" height="66" rx="4" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
      <text x="8" y="16" class="font-mono" font-size="8.5" font-weight="700" fill="#ffffff">Multi-stage Docker</text>
      <text x="8" y="30" class="font-mono" font-size="7.5" fill="#94a3b8">• node:22-alpine base</text>
      <text x="8" y="44" class="font-mono" font-size="7.5" fill="#34d399">• Multi-Stage Layer</text>
      <text x="8" y="58" class="font-mono" font-size="7.5" fill="#94a3b8">• Non-root runner</text>
    </g>

    <!-- Trivy Security Scan -->
    <g transform="translate(12, 114)">
      <rect x="0" y="0" width="151" height="66" rx="4" fill="#0b1120" stroke="#10b981" stroke-width="1"/>
      <text x="8" y="16" class="font-mono" font-size="8.5" font-weight="700" fill="#34d399">Trivy Vulnerability Scan</text>
      <text x="8" y="30" class="font-mono" font-size="7.5" fill="#94a3b8">• Automated Container Scan</text>
      <text x="8" y="44" class="font-mono" font-size="7.5" fill="#94a3b8">• PR Quality Blocker</text>
      <text x="8" y="58" class="font-mono" font-size="7.5" fill="#10b981">[SECURITY GATE]</text>
    </g>

    <!-- Rolling Deploy -->
    <g transform="translate(12, 190)">
      <rect x="0" y="0" width="151" height="80" rx="4" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
      <text x="8" y="16" class="font-mono" font-size="8.5" font-weight="700" fill="#f8fafc">Zero-Downtime Release</text>
      <text x="8" y="30" class="font-mono" font-size="7.5" fill="#94a3b8">• prisma migrate deploy</text>
      <text x="8" y="44" class="font-mono" font-size="7.5" fill="#94a3b8">• /api/v1/health/ready</text>
      <text x="8" y="58" class="font-mono" font-size="7.5" fill="#94a3b8">• Instant SHA Rollback</text>
    </g>
  </g>


  <!-- ================= BUS CABLES ================= -->
  <!-- Next.js -> NestJS -->
  <line x1="195" y1="110" x2="245" y2="110" stroke="#38bdf8" stroke-width="2"/>
  <line x1="195" y1="110" x2="245" y2="110" stroke="#38bdf8" stroke-width="2" class="flow-h"/>

  <!-- NestJS -> PostgreSQL -->
  <line x1="440" y1="135" x2="490" y2="135" stroke="#38bdf8" stroke-width="2"/>
  <line x1="440" y1="135" x2="490" y2="135" stroke="#38bdf8" stroke-width="2" class="flow-h"/>

  <!-- NestJS -> Gmail -->
  <line x1="440" y1="230" x2="490" y2="230" stroke="#fb923c" stroke-width="2"/>
  <line x1="440" y1="230" x2="490" y2="230" stroke="#fb923c" stroke-width="2" class="flow-h"/>

  <!-- NestJS -> CI/CD -->
  <path d="M 342 360 Q 342 380 802 380 L 802 360" fill="none" stroke="#10b981" stroke-width="2"/>
  <path d="M 342 360 Q 342 380 802 380 L 802 360" fill="none" stroke="#10b981" stroke-width="2" class="flow-h"/>
</svg>
