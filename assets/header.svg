<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 170" width="100%" height="100%">
  <defs>
    <linearGradient id="hdr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="hdr-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#21262d"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <style><![CDATA[
    .font-mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  ]]></style>

  <!-- Background Card (Spacious 8px inset) -->
  <rect x="8" y="8" width="884" height="154" rx="10" fill="url(#hdr-bg)" stroke="url(#hdr-border)" stroke-width="1"/>

  <!-- Left Content (Generous top & left margins: x=48, y=48) -->
  <g transform="translate(48, 48)">
    <text x="0" y="0" class="font-sans" font-size="28" font-weight="800" fill="url(#name-grad)" letter-spacing="0.4">Mahija Ibad Pradipta</text>
    <text x="0" y="28" class="font-sans" font-size="14" font-weight="500" fill="#8b949e">Computer Engineering • Software, Embedded Systems &amp; Vision</text>
  </g>

  <!-- Pill Badges (Generous vertical spacing: y=114) -->
  <g transform="translate(48, 114)">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="96" height="26" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="48" y="17" text-anchor="middle" class="font-mono" font-size="10.5" font-weight="600" fill="#8b949e">INDONESIA</text>
    </g>
    <g transform="translate(108, 0)">
      <rect x="0" y="0" width="154" height="26" rx="5" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="77" y="17" text-anchor="middle" class="font-mono" font-size="10.5" font-weight="600" fill="#38bdf8">portfolio.eeja.fun</text>
    </g>
    <g transform="translate(274, 0)">
      <rect x="0" y="0" width="120" height="26" rx="5" fill="#0f2d4a" stroke="#0284c7" stroke-width="1"/>
      <circle cx="15" cy="13" r="3" fill="#38bdf8"/>
      <text x="68" y="17" text-anchor="middle" class="font-mono" font-size="10.5" font-weight="600" fill="#38bdf8">AVAILABLE</text>
    </g>
  </g>

  <!-- Right Geometric Subnet Graphic (Spacious margin: x=815, y=85) -->
  <g transform="translate(815, 85)">
    <circle cx="0" cy="0" r="28" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <!-- Clean Minimal Chip Icon -->
    <rect x="-11" y="-11" width="22" height="22" rx="3" fill="none" stroke="#38bdf8" stroke-width="1.6"/>
    <circle cx="0" cy="0" r="3.5" fill="#38bdf8"/>
    <line x1="-11" y1="-5" x2="-16" y2="-5" stroke="#38bdf8" stroke-width="1.2"/>
    <line x1="-11" y1="5" x2="-16" y2="5" stroke="#38bdf8" stroke-width="1.2"/>
    <line x1="11" y1="-5" x2="16" y2="-5" stroke="#38bdf8" stroke-width="1.2"/>
    <line x1="11" y1="5" x2="16" y2="5" stroke="#38bdf8" stroke-width="1.2"/>
    <line x1="-5" y1="-11" x2="-5" y2="-16" stroke="#38bdf8" stroke-width="1.2"/>
    <line x1="5" y1="-11" x2="5" y2="-16" stroke="#38bdf8" stroke-width="1.2"/>
    <line x1="-5" y1="11" x2="-5" y2="16" stroke="#38bdf8" stroke-width="1.2"/>
    <line x1="5" y1="11" x2="5" y2="16" stroke="#38bdf8" stroke-width="1.2"/>
  </g>
</svg>
