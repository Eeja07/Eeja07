<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="100%" height="100%">
  <defs>
    <pattern id="mivion-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.4"/>
    </pattern>

    <linearGradient id="mivion-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="box-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <style><![CDATA[
    .font-mono { font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, 'Courier New', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

    @keyframes stream-h {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes stream-v {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulse-status {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .flow-h { stroke-dasharray: 6 10; animation: stream-h 1.6s linear infinite; }
    .flow-v { stroke-dasharray: 6 10; animation: stream-v 1.6s linear infinite; }
    .pulse-dot { animation: pulse-status 2s infinite; }
  ]]></style>

  <!-- Frame Background -->
  <rect x="2" y="2" width="916" height="396" rx="10" fill="#090d16" stroke="url(#mivion-border)" stroke-width="1.2"/>
  <rect x="6" y="6" width="908" height="388" rx="8" fill="url(#mivion-grid)"/>

  <!-- Top Title Bar -->
  <g transform="translate(30, 24)">
    <circle cx="6" cy="6" r="4" fill="#00e5ff" class="pulse-dot"/>
    <text x="18" y="10" class="font-mono" font-size="11" font-weight="700" fill="#00e5ff" letter-spacing="1.5">NODE_01 ARCHITECTURE // MIVION IOT SURVEILLANCE &amp; FLEET PLATFORM</text>
    <text x="860" y="10" text-anchor="end" class="font-mono" font-size="9" fill="#64748b">CONTAINERIZED MICROSERVICES</text>
  </g>

  <!-- ================= PIPELINE STAGES & NODES ================= -->

  <!-- 1. EDGE FLEET (Left) -->
  <g transform="translate(30, 70)">
    <rect x="0" y="0" width="150" height="290" rx="8" fill="url(#box-grad)" stroke="#1e293b" stroke-width="1.2"/>
    <rect x="0" y="0" width="150" height="26" rx="8" fill="#1e293b" opacity="0.6"/>
    <text x="75" y="17" text-anchor="middle" class="font-mono" font-size="9.5" font-weight="700" fill="#38bdf8">EDGE FLEET</text>

    <!-- Sub-node 1: ESP32-CAM Primary -->
    <g transform="translate(12, 40)">
      <rect x="0" y="0" width="126" height="60" rx="5" fill="#0b1120" stroke="#00e5ff" stroke-width="1"/>
      <text x="10" y="18" class="font-mono" font-size="9" font-weight="700" fill="#ffffff">ESP32-CAM #01</text>
      <text x="10" y="32" class="font-mono" font-size="7.5" fill="#94a3b8">JPEG Capture (VGA)</text>
      <text x="10" y="46" class="font-mono" font-size="7.5" fill="#00e5ff">WSS / MQTT Client</text>
    </g>

    <!-- Sub-node 2: ESP32-CAM Fleet N -->
    <g transform="translate(12, 115)">
      <rect x="0" y="0" width="126" height="60" rx="5" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
      <text x="10" y="18" class="font-mono" font-size="9" font-weight="700" fill="#ffffff">ESP32-CAM #02..N</text>
      <text x="10" y="32" class="font-mono" font-size="7.5" fill="#94a3b8">Telemetry Publisher</text>
      <text x="10" y="46" class="font-mono" font-size="7.5" fill="#10b981">OTA Receiver Ready</text>
    </g>

    <!-- Sub-node 3: Staged OTA Target -->
    <g transform="translate(12, 190)">
      <rect x="0" y="0" width="126" height="80" rx="5" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
      <text x="10" y="18" class="font-mono" font-size="8.5" font-weight="700" fill="#f59e0b">OTA FLASH ENGINE</text>
      <text x="10" y="32" class="font-mono" font-size="7.5" fill="#94a3b8">• SHA256 Checksum</text>
      <text x="10" y="46" class="font-mono" font-size="7.5" fill="#94a3b8">• Progressive Rollout</text>
      <text x="10" y="60" class="font-mono" font-size="7.5" fill="#94a3b8">• Auto-Rollback Guard</text>
    </g>
  </g>


  <!-- 2. INGESTION & BROKER LAYER (Middle-Left) -->
  <g transform="translate(235, 70)">
    <!-- EMQX Broker -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="180" height="130" rx="8" fill="url(#box-grad)" stroke="#38bdf8" stroke-width="1.2"/>
      <rect x="0" y="0" width="180" height="24" rx="8" fill="#0284c7" opacity="0.2"/>
      <text x="12" y="16" class="font-mono" font-size="9.5" font-weight="700" fill="#38bdf8">EMQX BROKER v5</text>
      <text x="168" y="16" text-anchor="end" class="font-mono" font-size="8" fill="#64748b">:1883</text>
      
      <text x="12" y="44" class="font-mono" font-size="8" fill="#94a3b8">• MQTT Telemetry Ingest</text>
      <text x="12" y="62" class="font-mono" font-size="8" fill="#94a3b8">• Webhook Event Triggers</text>
      <text x="12" y="80" class="font-mono" font-size="8" fill="#94a3b8">• Heartbeat / State Monitor</text>
      <text x="12" y="98" class="font-mono" font-size="8" fill="#94a3b8">• Config Dispatch Topic</text>
      <rect x="12" y="106" width="156" height="16" rx="3" fill="#0369a1" opacity="0.3"/>
      <text x="90" y="118" text-anchor="middle" class="font-mono" font-size="7.5" font-weight="700" fill="#38bdf8">ws/camera/{id}/telemetry</text>
    </g>

    <!-- Laravel Reverb WebSockets -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="180" height="130" rx="8" fill="url(#box-grad)" stroke="#a855f7" stroke-width="1.2"/>
      <rect x="0" y="0" width="180" height="24" rx="8" fill="#7e22ce" opacity="0.2"/>
      <text x="12" y="16" class="font-mono" font-size="9.5" font-weight="700" fill="#c084fc">LARAVEL REVERB</text>
      <text x="168" y="16" text-anchor="end" class="font-mono" font-size="8" fill="#64748b">:8080</text>
      
      <text x="12" y="44" class="font-mono" font-size="8" fill="#94a3b8">• High-throughput WSS</text>
      <text x="12" y="62" class="font-mono" font-size="8" fill="#94a3b8">• Sub-second UI Broadcast</text>
      <text x="12" y="80" class="font-mono" font-size="8" fill="#94a3b8">• Camera Online/Offline Evts</text>
      <text x="12" y="98" class="font-mono" font-size="8" fill="#94a3b8">• OTA Progress Streaming</text>
      <rect x="12" y="106" width="156" height="16" rx="3" fill="#6b21a8" opacity="0.3"/>
      <text x="90" y="118" text-anchor="middle" class="font-mono" font-size="7.5" font-weight="700" fill="#c084fc">presence-cctv-fleet</text>
    </g>
  </g>


  <!-- 3. CORE BACKEND PLATFORM (Center) -->
  <g transform="translate(470, 70)">
    <rect x="0" y="0" width="190" height="290" rx="8" fill="url(#box-grad)" stroke="#ef4444" stroke-width="1.2"/>
    <rect x="0" y="0" width="190" height="26" rx="8" fill="#ef4444" opacity="0.15"/>
    <text x="12" y="17" class="font-mono" font-size="9.5" font-weight="700" fill="#f87171">LARAVEL 11 CORE</text>
    <text x="178" y="17" text-anchor="end" class="font-mono" font-size="8" fill="#64748b">:80</text>

    <!-- Services inside Core -->
    <g transform="translate(12, 38)">
      <rect x="0" y="0" width="166" height="42" rx="4" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
      <text x="8" y="15" class="font-mono" font-size="8.5" font-weight="700" fill="#f8fafc">REST &amp; Webhook API</text>
      <text x="8" y="28" class="font-mono" font-size="7.5" fill="#94a3b8">/api/mqtt-webhook</text>
    </g>

    <g transform="translate(12, 88)">
      <rect x="0" y="0" width="166" height="42" rx="4" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
      <text x="8" y="15" class="font-mono" font-size="8.5" font-weight="700" fill="#f8fafc">Async Queue Workers</text>
      <text x="8" y="28" class="font-mono" font-size="7.5" fill="#94a3b8">Inference &amp; Notification</text>
    </g>

    <g transform="translate(12, 138)">
      <rect x="0" y="0" width="166" height="42" rx="4" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
      <text x="8" y="15" class="font-mono" font-size="8.5" font-weight="700" fill="#f8fafc">OTA Policy &amp; Manifests</text>
      <text x="8" y="28" class="font-mono" font-size="7.5" fill="#94a3b8">manifest.json Generation</text>
    </g>

    <g transform="translate(12, 188)">
      <rect x="0" y="0" width="166" height="42" rx="4" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
      <text x="8" y="15" class="font-mono" font-size="8.5" font-weight="700" fill="#f8fafc">Storage Pruning Cron</text>
      <text x="8" y="28" class="font-mono" font-size="7.5" fill="#94a3b8">14-day Auto File Cleanup</text>
    </g>

    <g transform="translate(12, 238)">
      <rect x="0" y="0" width="166" height="42" rx="4" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
      <text x="8" y="15" class="font-mono" font-size="8.5" font-weight="700" fill="#f8fafc">Database Layer</text>
      <text x="8" y="28" class="font-mono" font-size="7.5" fill="#94a3b8">MySQL 8.0 &amp; Telemetry</text>
    </g>
  </g>


  <!-- 4. STORAGE, AI & CONSUMERS (Right) -->
  <g transform="translate(710, 70)">
    <!-- MinIO Object Storage -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="180" height="88" rx="8" fill="url(#box-grad)" stroke="#e11d48" stroke-width="1.2"/>
      <rect x="0" y="0" width="180" height="22" rx="8" fill="#e11d48" opacity="0.2"/>
      <text x="10" y="15" class="font-mono" font-size="9" font-weight="700" fill="#fb7185">MINIO OBJECT S3</text>
      <text x="170" y="15" text-anchor="end" class="font-mono" font-size="8" fill="#64748b">:9000</text>
      <text x="10" y="38" class="font-mono" font-size="8" fill="#94a3b8">• Bucket: /cctv</text>
      <text x="10" y="52" class="font-mono" font-size="8" fill="#94a3b8">• Captured JPEGs Storage</text>
      <text x="10" y="66" class="font-mono" font-size="8" fill="#94a3b8">• Compiled .bin Firmware</text>
    </g>

    <!-- FastAPI Detection Service -->
    <g transform="translate(0, 100)">
      <rect x="0" y="0" width="180" height="92" rx="8" fill="url(#box-grad)" stroke="#10b981" stroke-width="1.2"/>
      <rect x="0" y="0" width="180" height="22" rx="8" fill="#059669" opacity="0.2"/>
      <text x="10" y="15" class="font-mono" font-size="9" font-weight="700" fill="#34d399">FASTAPI AI INFERENCE</text>
      <text x="170" y="15" text-anchor="end" class="font-mono" font-size="8" fill="#64748b">:8001</text>
      <text x="10" y="38" class="font-mono" font-size="8" fill="#94a3b8">• YOLO Human Detection</text>
      <text x="10" y="52" class="font-mono" font-size="8" fill="#94a3b8">• Motion Vector Analysis</text>
      <text x="10" y="66" class="font-mono" font-size="8" fill="#94a3b8">• /api/detection-feedback</text>
      <text x="10" y="80" class="font-mono" font-size="8" fill="#34d399">• Bounding Box Postback</text>
    </g>

    <!-- Blade / Vite Client UI -->
    <g transform="translate(0, 204)">
      <rect x="0" y="0" width="180" height="86" rx="8" fill="url(#box-grad)" stroke="#00e5ff" stroke-width="1.2"/>
      <rect x="0" y="0" width="180" height="22" rx="8" fill="#0284c7" opacity="0.2"/>
      <text x="10" y="15" class="font-mono" font-size="9" font-weight="700" fill="#00e5ff">BLADE / VITE UI</text>
      <text x="170" y="15" text-anchor="end" class="font-mono" font-size="8" fill="#64748b">WEB_PORT</text>
      <text x="10" y="38" class="font-mono" font-size="8" fill="#94a3b8">• Real-time Live Monitor</text>
      <text x="10" y="52" class="font-mono" font-size="8" fill="#94a3b8">• Staged Rollout Controller</text>
      <text x="10" y="66" class="font-mono" font-size="8" fill="#94a3b8">• Detection Alert Overlay</text>
    </g>
  </g>


  <!-- ================= DATA BUS & PACKET CABLES ================= -->

  <!-- Cable: ESP32 -> EMQX (Telemetry) -->
  <line x1="180" y1="135" x2="235" y2="135" stroke="#38bdf8" stroke-width="2"/>
  <line x1="180" y1="135" x2="235" y2="135" stroke="#38bdf8" stroke-width="2" class="flow-h"/>

  <!-- Cable: EMQX -> Laravel (Webhooks) -->
  <line x1="415" y1="135" x2="470" y2="135" stroke="#38bdf8" stroke-width="2"/>
  <line x1="415" y1="135" x2="470" y2="135" stroke="#38bdf8" stroke-width="2" class="flow-h"/>

  <!-- Cable: Laravel -> Reverb (Broadcast) -->
  <path d="M 470 215 L 415 215" fill="none" stroke="#a855f7" stroke-width="2"/>
  <path d="M 470 215 L 415 215" fill="none" stroke="#a855f7" stroke-width="2" class="flow-h"/>

  <!-- Cable: Laravel -> MinIO (Storage) -->
  <path d="M 660 115 L 710 115" fill="none" stroke="#fb7185" stroke-width="2"/>
  <path d="M 660 115 L 710 115" fill="none" stroke="#fb7185" stroke-width="2" class="flow-h"/>

  <!-- Cable: Laravel <-> FastAPI (Inference) -->
  <path d="M 660 150 L 710 150" fill="none" stroke="#34d399" stroke-width="2"/>
  <path d="M 660 150 L 710 150" fill="none" stroke="#34d399" stroke-width="2" class="flow-h"/>

  <!-- Cable: Reverb -> Frontend UI -->
  <path d="M 325 290 Q 325 380 790 380 L 790 290" fill="none" stroke="#a855f7" stroke-width="2"/>
  <path d="M 325 290 Q 325 380 790 380 L 790 290" fill="none" stroke="#a855f7" stroke-width="2" class="flow-h"/>
</svg>
